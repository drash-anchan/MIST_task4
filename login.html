<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChromaGlow - Welcome Back</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            light: '#f9a8d4',
                            DEFAULT: '#f472b6',
                            dark: '#db2777',
                        },
                        secondary: {
                            light: '#fef08a',
                            DEFAULT: '#facc15',
                            dark: '#eab308',
                        },
                        accent: {
                            pink: '#f472b6',
                            yellow: '#facc15',
                            dark: '#1e293b'
                        },
                        background: {
                            light: '#f8fafc',
                            DEFAULT: '#f1f5f9',
                            dark: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
    
</head>
<body class="bg-gradient-to-br from-primary-light to-secondary-light min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white/90 backdrop-blur-sm rounded-xl shadow-xl p-8 border border-white/20">
<div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Welcome</h1>
            <p class="text-gray-600">Sign in to continue</p>
        </div>
        <form class="space-y-4">
            <div>
                <label for="email" class="block text-sm text-gray-600 mb-1">Email</label>
                <input id="email" name="email" type="email" required 
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                       placeholder="your@email.com">
            </div>
            
            <div>
                <label for="password" class="block text-sm text-gray-600 mb-1">Password</label>
                <input id="password" name="password" type="password" required 
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" 
                       placeholder="••••••••">
            </div>
            
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" 
                           class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                    <label for="remember-me" class="ml-2 text-sm text-gray-600">Remember me</label>
                </div>
                
                <a href="#" class="text-sm text-blue-600 hover:text-blue-800">Forgot password?</a>
            </div>
            <button type="submit" 
                    class="w-full bg-gradient-to-r from-primary to-secondary text-white font-medium py-3 px-4 rounded-lg focus:outline-none ">
                Sign In
            </button>
<div class="text-center text-sm text-gray-600">
                Don't have an account? <a href="#" class="text-blue-600 hover:text-blue-800 font-medium">Sign up</a>
            </div>
        </form>

          <a href = "index.html">Back to Home </a>
    </div>

</body>
</html>
